# Render Blueprint — free one-click deploy of CivicPulse (web app + PostgreSQL).
# Render dashboard → New → Blueprint → select this repository → Apply.
#
# Free-tier notes:
#  * The free web service sleeps after ~15 min idle; the next visit takes ~1 min to wake up.
#  * Free instances have no persistent disk, so photos are stored in PostgreSQL
#    (STORAGE_PROVIDER=database).
#  * The free Render PostgreSQL database expires after 30 days. Upgrade its plan, or point
#    DATABASE_URL at a free Neon/Supabase database, to keep data longer.
# For a paid setup with a photo disk, see docs/deployment.md.

databases:
  - name: civicpulse-db
    plan: free
    region: singapore
    databaseName: civicpulse
    user: civicpulse
    postgresMajorVersion: "16"

services:
  - type: web
    name: civicpulse
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    # Migrates, seeds demo data on the very first boot (only when the database is empty), then
    # starts the standalone server.
    startCommand: npm run start:bootstrap
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: civicpulse-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: STORAGE_PROVIDER
        value: database
      - key: MAX_VIDEO_MB
        value: "15"
      # Hotspot/priority/analytics maintenance runs in-process while the service is awake.
      - key: ENABLE_INTERNAL_SCHEDULER
        value: "true"
      # Public demo: show one-click demo logins. Set to "false" for a real deployment.
      - key: SHOW_DEMO_ACCOUNTS
        value: "true"
      - key: NOTIFY_EMAIL_TO
        value: ops@example.gov
      # Optional: Slack-compatible webhook for urgent alerts.
      - key: NOTIFY_WEBHOOK_URL
        sync: false
