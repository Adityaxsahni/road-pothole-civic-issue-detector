# Render Blueprint — one-click deploy of CivicPulse (web app + PostgreSQL + persistent photo disk).
# Render dashboard → New → Blueprint → select this repository → Apply.
#
# Cost notes: persistent disks require a paid instance (Starter). The free Postgres plan expires
# after 30 days — upgrade the database plan (e.g. basic-256mb) to keep data beyond that.

databases:
  - name: civicpulse-db
    plan: free
    region: singapore
    databaseName: civicpulse
    user: civicpulse
    postgresMajorVersion: "16"

services:
  - type: web
    name: civicpulse
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    # Migrates, seeds demo data on the very first boot (only when the database is empty), then
    # starts the standalone server. Runs on the instance so the seed can write to the photo disk.
    startCommand: npm run start:bootstrap
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: uploads
      mountPath: /opt/render/project/src/storage/uploads
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: civicpulse-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /opt/render/project/src/storage/uploads
      # Hotspot/priority/analytics maintenance runs in-process every 15 minutes.
      - key: ENABLE_INTERNAL_SCHEDULER
        value: "true"
      # Public demo: show one-click demo logins. Set to "false" for a real deployment.
      - key: SHOW_DEMO_ACCOUNTS
        value: "true"
      - key: NOTIFY_EMAIL_TO
        value: ops@example.gov
      # Optional: Slack-compatible webhook for urgent alerts.
      - key: NOTIFY_WEBHOOK_URL
        sync: false
